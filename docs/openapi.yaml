        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        'default': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Requires an administrative role claim.
  headers:
    RateLimitLimit:
      description: Maximum requests allowed in the current window.
      schema: { type: integer }
      example: 120
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema: { type: integer }
      example: 119
    RateLimitReset:
      description: Unix timestamp when the current rate-limit window resets.
      schema: { type: integer }
      example: 1792490400
    RetryAfter:
      description: Seconds until retry is allowed.
      schema: { type: integer }
      example: 60
  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Pair:
      name: pair
      in: query
      required: true
      schema: { type: string, pattern: '^[A-Z]{3}/[A-Z]{3}$' }
      example: OMR/INR
    FromCurrency:
      name: from
      in: query
      required: true
      schema: { type: string, pattern: '^[A-Z]{3}$' }
      example: OMR
    ToCurrency:
      name: to
      in: query
      required: true
      schema: { type: string, pattern: '^[A-Z]{3}$' }
      example: INR
    Page:
      name: page
      in: query
      description: One-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: Page size, capped at 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "https://www.rfc-editor.org/rfc/rfc7807", title: "Invalid request", status: 400, detail: "The amount must be greater than zero.", instance: "/api/v1/convert" }
    Unauthorized:
      description: Authentication is required or invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "about:blank", title: "Unauthorized", status: 401, detail: "A valid bearer token is required.", instance: "/api/v1/favourites" }
    Forbidden:
      description: The authenticated user is not authorized.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "about:blank", title: "Forbidden", status: 403, detail: "Administrator role required.", instance: "/api/v1/admin/exchanges" }
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "about:blank", title: "Not found", status: 404, detail: "The requested resource was not found.", instance: "/api/v1/currencies/XYZ" }
    Conflict:
      description: Resource conflicts with an existing record.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "about:blank", title: "Conflict", status: 409, detail: "The resource already exists.", instance: "/api/v1/favourites" }
    RateLimited:
      description: Rate limit exceeded.
      headers:
        X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "about:blank", title: "Too many requests", status: 429, detail: "Retry after the current rate-limit window.", instance: "/api/v1/rates/latest" }
    Problem:
      description: RFC 7807 error response; controller stubs currently return 501 Not Implemented.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: "about:blank", title: "Not implemented", status: 501, detail: "This API endpoint is defined by the contract but is not implemented yet.", instance: "/api/v1/rates/latest" }
  schemas:
    Problem:
      type: object
      description: RFC 7807 Problem Details error response.
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        traceId: { type: string }
      additionalProperties: true
      example: { type: "about:blank", title: "Invalid request", status: 400, detail: "The request is invalid.", instance: "/api/v1/convert" }
    OtpRequest:
      type: object
      required: [channel, destination]
      properties:
        channel: { type: string, enum: [email, phone] }
        destination: { type: string, minLength: 1, maxLength: 320, description: Email address or E.164 phone number. }
    OtpVerificationRequest:
      allOf:
        - { $ref: '#/components/schemas/OtpRequest' }
        - type: object
          required: [code]
          properties:
            code: { type: string, pattern: '^[0-9]{6}$' }
    OtpRequestResponse:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 32, maxLength: 128, example: "opaque-refresh-token-example-000000000000000000000000" }
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, const: 900, description: Access token lifetime in seconds. }
    UserProfile:
      type: object
      required: [id, roles, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, 'null'], format: email }
        phoneNumber: { type: [string, 'null'], pattern: '^\\+[1-9][0-9]{7,14}$' }
        displayName: { type: [string, 'null'] }
        roles:
          type: array
          items: { type: string, enum: [User, Admin, PartnerManager, AdsManager, ReadOnly] }
        createdAt: { type: string, format: date-time }
    ProfileUpdate:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
    ConsentRequest:
      type: object
      required: [isGranted, version]
      properties:
        isGranted: { type: boolean }
        version: { type: string, minLength: 1, maxLength: 50 }
    ConsentState:
      type: object
      required: [type, version, isGranted, updatedAt]
      properties:
        type: { type: string, enum: [terms, privacy, marketing] }
        version: { type: string }
        isGranted: { type: boolean }
        updatedAt: { type: string, format: date-time }
    DeviceRegistration:
      type: object
      required: [fcmToken, platform]
      properties:
        fcmToken: { type: string, minLength: 1, maxLength: 4096 }
        platform: { type: string, enum: [android, ios] }
    Device:
      type: object
      required: [id, platform, createdAt]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [android, ios] }
        createdAt: { type: string, format: date-time }
    Currency:
      type: object
      required: [code, name, symbol, decimalPlaces]
      properties:
        code: { type: string, pattern: '^[A-Z]{3}$' }
        name: { type: string }
        symbol: { type: string }
        decimalPlaces: { type: integer, minimum: 0, maximum: 4 }
    MarketRate:
      type: object
      required: [pair, bid, ask, mid, source, fetchedAt, isStale]
      properties:
        pair: { type: string, pattern: '^[A-Z]{3}/[A-Z]{3}$' }
        bid: { type: number, format: double }
        ask: { type: number, format: double }
        mid: { type: number, format: double }
        source: { type: string }
        fetchedAt: { type: string, format: date-time }
        isStale: { type: boolean }
    HistoryBucket:
      type: string
      enum: ['1D', '1W', '1M', '6M', '1Y']
    RateHistory:
      type: object
      required: [pair, bucket, timestamp, value]
      properties:
        pair: { type: string }
        bucket: { $ref: '#/components/schemas/HistoryBucket' }
        timestamp: { type: string, format: date-time }
        value: { type: number, format: double }
    ConversionQuote:
      type: object
      required: [fromCurrency, toCurrency, amount, rate, convertedAmount, fetchedAt, isStale]
      properties:
        fromCurrency: { type: string }
        toCurrency: { type: string }
        amount: { type: number, format: double }
        rate: { type: number, format: double }
        convertedAmount: { type: number, format: double }
        fetchedAt: { type: string, format: date-time }
        isStale: { type: boolean }
    Exchange:
      type: object
      required: [id, name, slug, hasApp, status, tier]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        logoUrl: { type: [string, 'null'], format: uri }
        hasApp: { type: boolean }
        appDeepLink: { type: [string, 'null'] }
        playStoreUrl: { type: [string, 'null'], format: uri }
        gatewayUrl: { type: [string, 'null'], format: uri }
        status: { type: string, enum: [pending, active, suspended, inactive] }
        tier: { type: string, enum: [standard, featured, sponsored] }
    ExchangeWrite:
      type: object
      required: [name, slug, hasApp, status, tier]
      properties:
        name: { type: string, maxLength: 200 }
        slug: { type: string, maxLength: 200 }
        logoUrl: { type: [string, 'null'], format: uri }
        hasApp: { type: boolean }
        appDeepLink: { type: [string, 'null'] }
        playStoreUrl: { type: [string, 'null'], format: uri }
        gatewayUrl: { type: [string, 'null'], format: uri }
        status: { type: string, enum: [pending, active, suspended, inactive] }
        tier: { type: string, enum: [standard, featured, sponsored] }
    ExchangeFee:
      type: object
      properties:
        minAmount: { type: [number, 'null'], format: double }
        maxAmount: { type: [number, 'null'], format: double }
        flatFee: { type: [number, 'null'], format: double }
        percentFee: { type: [number, 'null'], format: double }
    ExchangeOffer:
      type: object
      required: [exchange, rate, amountReceived, fetchedAt, isStale]
      properties:
        exchange: { $ref: '#/components/schemas/Exchange' }
        rate: { type: number, format: double }
        fee: { oneOf: [{ $ref: '#/components/schemas/ExchangeFee' }, { type: 'null' }] }
        amountReceived: { type: number, format: double }
        fetchedAt: { type: string, format: date-time }
        isStale: { type: boolean }
    RedirectRequest:
      type: object
      required: [corridorId, amount]
      properties:
        corridorId: { type: string, format: uuid }
        amount: { type: number, format: double, exclusiveMinimum: 0 }
    FavouriteRequest:
      type: object
      required: [type, targetId]
      properties:
        type: { type: string, enum: [exchange, corridor] }
        targetId: { type: string, format: uuid }
    Favourite:
      allOf:
        - { $ref: '#/components/schemas/FavouriteRequest' }
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    AlertRequest:
      type: object
      required: [pair, direction, target]
      properties:
        pair: { type: string, pattern: '^[A-Z]{3}/[A-Z]{3}$' }
        direction: { type: string, enum: [above, below] }
        target: { type: number, format: double, exclusiveMinimum: 0 }
    AlertUpdate:
      type: object
      minProperties: 1
      properties:
        target: { type: number, format: double, exclusiveMinimum: 0 }
        isActive: { type: boolean }
    Alert:
      allOf:
        - { $ref: '#/components/schemas/AlertRequest' }
        - type: object
          required: [id, isActive]
          properties:
            id: { type: string, format: uuid }
            isActive: { type: boolean }
            lastTriggeredAt: { type: [string, 'null'], format: date-time }
    NewsItem:
      type: object
      required: [id, title, slug, summary, body]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        summary: { type: string }
        body: { type: string }
        sourceUrl: { type: [string, 'null'], format: uri }
        publishedAt: { type: [string, 'null'], format: date-time }
    NewsWrite:
      type: object
      required: [title, slug, summary, body, isPublished]
      properties:
        title: { type: string, maxLength: 300 }
        slug: { type: string, maxLength: 300 }
        summary: { type: string, maxLength: 1000 }
        body: { type: string }
        sourceUrl: { type: [string, 'null'], format: uri }
        isPublished: { type: boolean }
    AdCreative:
      type: object
      required: [id, slot, imageUrl, targetUrl, altText, sponsored]
      properties:
        id: { type: string, format: uuid }
        slot: { type: string }
        imageUrl: { type: string, format: uri }
        targetUrl: { type: string, format: uri }
        altText: { type: string }
        sponsored: { type: boolean, const: true }
    AdCampaignWrite:
      type: object
      required: [name, startsAt, endsAt, isActive]
      properties:
        name: { type: string, maxLength: 200 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        isActive: { type: boolean }
    AdCampaign:
      allOf:
        - { $ref: '#/components/schemas/AdCampaignWrite' }
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    RateSourceWrite:
      type: object
      required: [name, type, priority, isActive]
      properties:
        name: { type: string, maxLength: 200 }
        type: { type: string, enum: [provider, exchange, manual] }
        priority: { type: integer, minimum: 0 }
        isActive: { type: boolean }
    RateSource:
      allOf:
        - { $ref: '#/components/schemas/RateSourceWrite' }
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    MarketRateWrite:
      type: object
      required: [pair, bid, ask, mid, sourceId, fetchedAt, isStale]
      properties:
        pair: { type: string, pattern: '^[A-Z]{3}/[A-Z]{3}$' }
        bid: { type: number, format: double, minimum: 0 }
        ask: { type: number, format: double, minimum: 0 }
        mid: { type: number, format: double, minimum: 0 }
        sourceId: { type: string, format: uuid }
        fetchedAt: { type: string, format: date-time }
        isStale: { type: boolean }
    AuditLog:
      type: object
      required: [id, action, entityType, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: [string, 'null'], format: uuid }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        details: { type: [string, 'null'] }
    Page:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    PagedRateHistory:
      allOf: [{ $ref: '#/components/schemas/Page' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/RateHistory' } } } }]
    PagedExchanges:
      allOf: [{ $ref: '#/components/schemas/Page' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Exchange' } } } }]
    PagedOffers:
      allOf: [{ $ref: '#/components/schemas/Page' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ExchangeOffer' } } } }]
    PagedFavourites:
      allOf: [{ $ref: '#/components/schemas/Page' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Favourite' } } } }]
    PagedAlerts:
      allOf: [{ $ref: '#/components/schemas/Page' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Alert' } } } }]
    PagedNews:
      allOf: [{ $ref: '#/components/schemas/Page' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/NewsItem' } } } }]
    PagedAuditLogs:
      allOf: [{ $ref: '#/components/schemas/Page' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } } } }]
