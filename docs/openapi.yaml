openapi: 3.1.0
info:
  title: Remito API
  version: 1.0.0
  summary: Currency-rate comparison and exchange referral API
  description: >-
    Remito compares exchange offers and redirects customers to licensed exchanges.
    Remito does not process payments.
servers:
  - url: https://api.remito.example/api/v1
    description: Production base URL placeholder
tags:
  - name: Auth
  - name: Devices
  - name: Currencies
  - name: Rates
  - name: Convert
  - name: Exchanges
  - name: Compare
  - name: Redirect
  - name: Favourites
  - name: Alerts
  - name: News
  - name: Ads
  - name: Admin
security:
  - bearerAuth: []
paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Request a passwordless email or phone one-time code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
            example: { channel: email, destination: "user@example.com" }
      responses:
        '202':
          description: Request accepted without revealing account existence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestResponse' }
              example: { accepted: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        'default': { $ref: '#/components/responses/Problem' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Verify a one-time code and create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerificationRequest' }
            example: { channel: email, destination: "user@example.com", code: "123456" }
      responses:
        '200':
          description: 15-minute access token and rotating refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example: { accessToken: "eyJ...", refreshToken: "opaque-token", tokenType: Bearer, expiresIn: 900 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        'default': { $ref: '#/components/responses/Problem' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Refresh an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
            example: { refreshToken: "opaque-refresh-token-example-000000000000000000000000" }
      responses:
        '200':
          description: Refreshed token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example: { accessToken: "eyJ...", refreshToken: "opaque-token-2", tokenType: Bearer, expiresIn: 900 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        'default': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
            example: { refreshToken: "opaque-refresh-token-example-000000000000000000000000" }
      responses:
        '204': { description: Token revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        'default': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the authenticated user's profile
      responses:
        '200':
          description: Current profile and role claims
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
              example: { id: "2df427e3-8bb8-49d2-a793-419e5946e544", email: "user@example.com", phoneNumber: null, displayName: "Remito user", roles: [User], createdAt: "2026-10-20T09:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        'default': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Auth]
      operationId: updateCurrentUser
      summary: Update the authenticated user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
            example: { displayName: "Remito user" }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        'default': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Auth]
      operationId: deleteCurrentUser
      summary: Delete the current account and remove personal identifiers
      responses:
        '204': { description: Account deleted and analytics identifiers anonymised }
        '401': { $ref: '#/components/responses/Unauthorized' }
        'default': { $ref: '#/components/responses/Problem' }
  /me/consents:
    get:
      tags: [Auth]
      operationId: getConsents
      summary: Get current terms, privacy, and marketing consent state
      responses:
        '200':
          description: Consent state
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ConsentState' } }
              example: [{ type: terms, version: "1", isGranted: true, updatedAt: "2026-10-20T09:00:00Z" }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        'default': { $ref: '#/components/responses/Problem' }
  /me/consents/terms:
    put:
      tags: [Auth]
      operationId: acceptTerms
      summary: Record acceptance of the current terms version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRequest' }
            example: { isGranted: true, version: "1" }
      responses:
        '200':
          description: Consent recorded and audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        'default': { $ref: '#/components/responses/Problem' }
  /me/consents/privacy:
    put:
      tags: [Auth]
      operationId: acceptPrivacy
      summary: Record acceptance of the current privacy notice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRequest' }
            example: { isGranted: true, version: "1" }
      responses:
        '200':
          description: Consent recorded and audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        'default': { $ref: '#/components/responses/Problem' }
  /me/consents/marketing:
    put:
      tags: [Auth]
      operationId: updateMarketingConsent
      summary: Opt in or out of marketing communications
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRequest' }
            example: { isGranted: false, version: "1" }
      responses:
        '200':
          description: Consent preference recorded and audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        'default': { $ref: '#/components/responses/Problem' }
  /devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List the current user's registered devices
      responses:
        '200':
          description: Registered devices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
              example: [{ id: "2df427e3-8bb8-49d2-a793-419e5946e544", platform: android, createdAt: "2026-10-20T09:00:00Z" }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        'default': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Devices]
      operationId: registerDevice
      summary: Register or update a push-notification device
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
            example: { fcmToken: "fcm-token-value", platform: android }
      responses:
        '201':
          description: Device registered
          headers: { Location: { schema: { type: string }, example: /api/v1/devices/2df427e3-8bb8-49d2-a793-419e5946e544 } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
              example: { id: "2df427e3-8bb8-49d2-a793-419e5946e544", platform: android, createdAt: "2026-10-20T09:00:00Z" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        'default': { $ref: '#/components/responses/Problem' }
  /devices/{id}:
    delete:
      tags: [Devices]
      operationId: removeDevice
      summary: Remove a registered device
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
      responses:
        '204': { description: Device removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        'default': { $ref: '#/components/responses/Problem' }
  /currencies:
    get:
      tags: [Currencies]
      operationId: listCurrencies
      summary: List supported currencies
      security: []
      responses:
        '200':
          description: Supported currencies
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Currency' } }
              example: [{ code: OMR, name: Omani Rial, symbol: OMR, decimalPlaces: 3 }, { code: INR, name: Indian Rupee, symbol: INR, decimalPlaces: 2 }]
        'default': { $ref: '#/components/responses/Problem' }
  /currencies/{code}:
    get:
      tags: [Currencies]
      operationId: getCurrency
      summary: Get a supported currency
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z]{3}$' }
          example: INR
      responses:
        '200':
          description: Currency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Currency' }
              example: { code: INR, name: Indian Rupee, symbol: INR, decimalPlaces: 2 }
        '404': { $ref: '#/components/responses/NotFound' }
        'default': { $ref: '#/components/responses/Problem' }
  /rates/latest:
    get:
      tags: [Rates]
      operationId: getLatestRate
      summary: Get the latest market rate for a currency pair
      security: []
      parameters:
        - { $ref: '#/components/parameters/Pair' }
      responses:
        '200':
          description: Latest market rate
          headers: { X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }, X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }, X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketRate' }
              example: { pair: OMR/INR, bid: 216.25, ask: 217.15, mid: 216.7, source: "Market feed", fetchedAt: "2026-10-20T09:00:00Z", isStale: false }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        'default': { $ref: '#/components/responses/Problem' }
  /rates/history:
    get:
      tags: [Rates]
      operationId: getRateHistory
      summary: Get time-bucketed historical rates
      security: []
      parameters:
        - { $ref: '#/components/parameters/Pair' }
        - name: bucket
          in: query
          required: true
          schema: { $ref: '#/components/schemas/HistoryBucket' }
          example: 1D
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Historical rate samples
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedRateHistory' }
              example: { items: [{ pair: OMR/INR, bucket: 1D, timestamp: "2026-10-20T00:00:00Z", value: 216.7 }], page: 1, pageSize: 50, totalItems: 1, totalPages: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        'default': { $ref: '#/components/responses/Problem' }
  /convert:
    get:
      tags: [Convert]
      operationId: convertAmount
      summary: Convert an amount using the latest market mid-rate
      security: []
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' }, example: OMR }
        - { name: to, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' }, example: INR }
        - { name: amount, in: query, required: true, schema: { type: number, format: double, exclusiveMinimum: 0 }, example: 10 }
      responses:
        '200':
          description: Converted amount and rate timestamp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionQuote' }
              example: { fromCurrency: OMR, toCurrency: INR, amount: 10, rate: 216.7, convertedAmount: 2167, fetchedAt: "2026-10-20T09:00:00Z", isStale: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        'default': { $ref: '#/components/responses/Problem' }
  /exchanges:
    get:
      tags: [Exchanges]
      operationId: listExchanges
      summary: List active exchanges
      security: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Active exchanges
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedExchanges' }
              example: { items: [{ id: "6df7d0cc-6fbb-4859-9e3a-9b9e9510e15f", name: "Example Exchange", slug: example-exchange, logoUrl: null, hasApp: false, appDeepLink: null, playStoreUrl: null, gatewayUrl: "https://exchange.example", status: active, tier: standard }], page: 1, pageSize: 20, totalItems: 1, totalPages: 1 }
        'default': { $ref: '#/components/responses/Problem' }
  /exchanges/{slug}:
    get:
      tags: [Exchanges]
      operationId: getExchange
      summary: Get exchange information
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
          example: example-exchange
      responses:
        '200':
          description: Exchange
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
              example: { id: "6df7d0cc-6fbb-4859-9e3a-9b9e9510e15f", name: "Example Exchange", slug: example-exchange, logoUrl: null, hasApp: false, appDeepLink: null, playStoreUrl: null, gatewayUrl: "https://exchange.example", status: active, tier: standard }
        '404': { $ref: '#/components/responses/NotFound' }
        'default': { $ref: '#/components/responses/Problem' }
  /compare:
    get:
      tags: [Compare]
      operationId: compareExchanges
      summary: Compare exchange offers for a corridor and amount
      security: []
      parameters:
        - { $ref: '#/components/parameters/FromCurrency' }
        - { $ref: '#/components/parameters/ToCurrency' }
        - { name: amount, in: query, required: true, schema: { type: number, format: double, exclusiveMinimum: 0 }, example: 10 }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Offers ordered by net amount received
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedOffers' }
              example: { items: [{ exchange: { id: "6df7d0cc-6fbb-4859-9e3a-9b9e9510e15f", name: "Example Exchange", slug: example-exchange, logoUrl: null, hasApp: false, appDeepLink: null, playStoreUrl: null, gatewayUrl: "https://exchange.example", status: active, tier: standard }, rate: 216.5, fee: null, amountReceived: 2165, fetchedAt: "2026-10-20T09:00:00Z", isStale: false }], page: 1, pageSize: 20, totalItems: 1, totalPages: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        'default': { $ref: '#/components/responses/Problem' }
  /redirect/{exchangeId}:
    post:
      tags: [Redirect]
      operationId: createRedirect
      summary: Record a referral click and redirect to the exchange
      parameters:
        - name: exchangeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedirectRequest' }
            example: { corridorId: "0f43b2c9-44b3-4b91-8e7f-2aa9e19ecb01", amount: 10 }
      responses:
        '302':
          description: Redirect to the exchange gateway
          headers:
            Location: { schema: { type: string, format: uri }, example: "https://exchange.example/transfer" }
            X-Click-Id: { schema: { type: string }, example: "click_01JABCD" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        'default': { $ref: '#/components/responses/Problem' }
  /favourites:
    get:
      tags: [Favourites]
      operationId: listFavourites
      summary: List the current user's favourites
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Favourites
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedFavourites' }
              example: { items: [{ id: "8f5f600e-f80c-422b-ac18-4967b99b9052", type: exchange, targetId: "6df7d0cc-6fbb-4859-9e3a-9b9e9510e15f", createdAt: "2026-10-20T09:00:00Z" }], page: 1, pageSize: 20, totalItems: 1, totalPages: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        'default': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Favourites]
      operationId: createFavourite
      summary: Add a favourite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavouriteRequest' }
            example: { type: exchange, targetId: "6df7d0cc-6fbb-4859-9e3a-9b9e9510e15f" }
      responses:
        '201':
          description: Favourite added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favourite' }
              example: { id: "8f5f600e-f80c-422b-ac18-4967b99b9052", type: exchange, targetId: "6df7d0cc-6fbb-4859-9e3a-9b9e9510e15f", createdAt: "2026-10-20T09:00:00Z" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        'default': { $ref: '#/components/responses/Problem' }
  /favourites/{id}:
    delete:
      tags: [Favourites]
      operationId: deleteFavourite
      summary: Remove a favourite
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
      responses:
        '204': { description: Favourite removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        'default': { $ref: '#/components/responses/Problem' }
  /alerts:
    get:
      tags: [Alerts]
      operationId: listAlerts
      summary: List the current user's rate alerts
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedAlerts' }
              example: { items: [{ id: "8f5f600e-f80c-422b-ac18-4967b99b9052", pair: OMR/INR, direction: above, target: 220, isActive: true, lastTriggeredAt: null }], page: 1, pageSize: 20, totalItems: 1, totalPages: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        'default': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Alerts]
      operationId: createAlert
      summary: Create a rate alert
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRequest' }
            example: { pair: OMR/INR, direction: above, target: 220 }
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
              example: { id: "8f5f600e-f80c-422b-ac18-4967b99b9052", pair: OMR/INR, direction: above, target: 220, isActive: true, lastTriggeredAt: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        'default': { $ref: '#/components/responses/Problem' }
  /alerts/{id}:
    patch:
      tags: [Alerts]
      operationId: updateAlert
      summary: Update alert threshold or active state
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertUpdate' }
            example: { target: 225, isActive: true }
      responses:
        '200':
          description: Updated alert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
              example: { id: "8f5f600e-f80c-422b-ac18-4967b99b9052", pair: OMR/INR, direction: above, target: 225, isActive: true, lastTriggeredAt: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        'default': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Alerts]
      operationId: deleteAlert
      summary: Delete a rate alert
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
      responses:
        '204': { description: Alert deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        'default': { $ref: '#/components/responses/Problem' }
  /news:
    get:
      tags: [News]
      operationId: listNews
      summary: List published news
      security: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Published news
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedNews' }
              example: { items: [{ id: "8f5f600e-f80c-422b-ac18-4967b99b9052", title: "Currency market update", slug: currency-market-update, summary: "A sample update.", body: "Example news content.", sourceUrl: null, publishedAt: "2026-10-20T09:00:00Z" }], page: 1, pageSize: 20, totalItems: 1, totalPages: 1 }
        'default': { $ref: '#/components/responses/Problem' }
  /news/{slug}:
    get:
      tags: [News]
      operationId: getNews
      summary: Get a published news item
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string }, example: currency-market-update }
      responses:
        '200':
          description: News item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsItem' }
