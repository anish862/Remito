name: Android CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  quality:
    name: android-quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint, ktlint, detekt, tests, and dev APK
        working-directory: android
        run: ./gradlew --no-daemon lintDevDebug ktlintCheck detekt testDebugUnitTest testDevDebugUnitTest assembleDevDebug
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/dev/debug/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: android-signed-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/remito-release.keystore
          REMITO_CERTIFICATE_PINS: ${{ vars.REMITO_CERTIFICATE_PINS }}
        run: |
          test -n "$REMITO_CERTIFICATE_PINS"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
      - name: Build signed release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/remito-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REMITO_CERTIFICATE_PINS: ${{ vars.REMITO_CERTIFICATE_PINS }}
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix." >&2
            exit 1
          fi
          ./gradlew --no-daemon \
            -PREMITO_CERTIFICATE_PINS="$REMITO_CERTIFICATE_PINS" \
            -PREMITO_VERSION_CODE="${GITHUB_RUN_NUMBER}" \
            -PREMITO_VERSION_NAME="$version_name" \
            bundleProdRelease
      - uses: actions/upload-artifact@v4
        with:
          name: remito-release-${{ github.ref_name }}
          path: |
            android/app/build/outputs/bundle/prodRelease/app-prod-release.aab
            android/app/build/outputs/mapping/prodRelease/mapping.txt
          if-no-files-found: error
          retention-days: 90
