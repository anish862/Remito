services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: remito-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your environment}
    ports:
      - "1433:1433"
    volumes:
      - remito-sqlserver-data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: remito-redis
    ports:
      - "6379:6379"
    volumes:
      - remito-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  remito-sqlserver-data:
  remito-redis-data: